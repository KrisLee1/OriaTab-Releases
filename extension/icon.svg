  <!-- All material is vector gradients; the counter and canvas stay transparent. -->
  <!-- Align the halo center (256, 269) with the canvas center; Aide follows the halo. -->
  <g transform="translate(0 -13)">
  <g clip-path="url(#halo-clip)">
    <path fill="url(#halo-base)" d="M60 78h392v382H60z"/>
    <path fill="url(#halo-cyan)" d="M60 78h392v382H60z"/>
    <path fill="url(#halo-crown)" d="M60 78h392v382H60z"/>
    <path fill="url(#halo-lilac)" d="M60 78h392v382H60z"/>
    <path fill="url(#halo-pearl)" d="M60 78h392v382H60z"/>
  </g>
  <use href="#halo" stroke="url(#halo-edge)" stroke-width=".8"/>
  <!-- Aide: original idle body contour from public/aide/aide.svg, uniformly scaled and rotated; face omitted for the brand mark. -->
  <use href="#spark" fill="url(#star-base)"/>
  <g clip-path="url(#star-clip)">
    <path fill="url(#star-light)" d="M255 44h230v257H255z"/>
    <path fill="url(#star-tip)" d="M255 44h230v257H255z"/>
  </g>
  <use href="#spark" stroke="url(#star-edge)" stroke-width=".8" stroke-linejoin="round"/>
  </g>
